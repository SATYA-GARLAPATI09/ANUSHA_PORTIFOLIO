<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fcd34d"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  
  <!-- Outer circle border -->
  <circle cx="100" cy="100" r="96" fill="#f8fafc" stroke="#e2e8f0" stroke-width="3"/>
  <circle cx="100" cy="100" r="90" fill="#f1f5f9"/>

  <!-- Code background motifs -->
  <text x="35" y="70" font-family="monospace" font-size="14" fill="#94a3b8" opacity="0.6">&lt;dev&gt;</text>
  <text x="135" y="130" font-family="monospace" font-size="14" fill="#94a3b8" opacity="0.6">&lt;/&gt;</text>

  <!-- Hair back -->
  <path d="M 60,110 C 50,70 70,30 100,30 C 130,30 150,70 140,110 C 138,135 135,150 135,150 L 65,150 C 65,150 62,135 60,110 Z" fill="url(#hairGrad)"/>

  <!-- Neck -->
  <rect x="90" y="125" width="20" height="25" rx="6" fill="#fbcfe8"/>

  <!-- Head -->
  <ellipse cx="100" cy="95" rx="32" ry="36" fill="#fef08a"/>

  <!-- Hair front bangs -->
  <path d="M 68,90 C 70,60 90,45 100,45 C 115,45 132,60 132,90 C 122,70 115,65 100,68 C 85,65 78,75 68,90 Z" fill="url(#hairGrad)"/>

  <!-- Glasses -->
  <rect x="76" y="86" width="20" height="15" rx="4" fill="none" stroke="#1e40af" stroke-width="2.5"/>
  <rect x="104" y="86" width="20" height="15" rx="4" fill="none" stroke="#1e40af" stroke-width="2.5"/>
  <line x1="96" y1="93" x2="104" y2="93" stroke="#1e40af" stroke-width="2.5"/>

  <!-- Eyes behind glasses -->
  <circle cx="86" cy="93" r="2.5" fill="#1e293b"/>
  <circle cx="114" cy="93" r="2.5" fill="#1e293b"/>

  <!-- Smile -->
  <path d="M 92,114 Q 100,122 108,114" fill="none" stroke="#dc2626" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Clothes / Collar -->
  <path d="M 62,150 C 62,135 75,130 100,130 C 125,130 138,135 138,150 L 145,190 L 55,190 Z" fill="url(#bgGrad)"/>
  <polygon points="100,146 88,130 112,130" fill="#ffffff"/>
  
  <!-- Subtle Laptop rim -->
  <rect x="68" y="175" width="64" height="8" rx="2" fill="#cbd5e1"/>
</svg>

