<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Client-server model for a web application</title>
  <desc id="desc">A browser sends an HTTP request to a web server, which returns HTML, CSS, JavaScript and data.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eef5ff"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1f5ea8"/></marker>
  </defs>
  <rect width="1600" height="760" fill="url(#bg)"/>
  <text x="800" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#123c70">Client-Server Model for a Web Application</text>
  <rect x="95" y="220" width="340" height="270" rx="24" fill="#ffffff" stroke="#1f5ea8" stroke-width="5"/>
  <text x="265" y="292" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#123c70">User / Browser</text>
  <rect x="172" y="330" width="185" height="102" rx="12" fill="#dcecff" stroke="#5b8fc9" stroke-width="3"/>
  <text x="265" y="374" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#123c70">Chrome, Edge</text>
  <text x="265" y="407" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#123c70">or mobile browser</text>
  <path d="M470 300 C600 300 600 250 720 250" stroke="#1f5ea8" stroke-width="8" fill="none" marker-end="url(#arrow)"/>
  <text x="590" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#1f5ea8">HTTP request</text>
  <path d="M720 445 C600 445 600 410 470 410" stroke="#268653" stroke-width="8" fill="none" marker-end="url(#arrow)"/>
  <text x="590" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#268653">HTTP response</text>
  <rect x="750" y="170" width="380" height="390" rx="24" fill="#ffffff" stroke="#1f5ea8" stroke-width="5"/>
  <text x="940" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#123c70">Web Server</text>
  <rect x="818" y="285" width="244" height="195" rx="14" fill="#e5f6ed" stroke="#268653" stroke-width="3"/>
  <text x="940" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#17623b">Application logic</text>
  <text x="940" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#17623b">files, APIs and</text>
  <text x="940" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#17623b">business rules</text>
  <path d="M1160 325 L1270 325" stroke="#1f5ea8" stroke-width="8" fill="none" marker-end="url(#arrow)"/>
  <path d="M1160 430 L1270 430" stroke="#1f5ea8" stroke-width="8" fill="none" marker-end="url(#arrow)"/>
  <rect x="1300" y="190" width="230" height="170" rx="18" fill="#fff6df" stroke="#d89819" stroke-width="4"/>
  <text x="1415" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#855a00">Web assets</text>
  <text x="1415" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#855a00">HTML, CSS, JS</text>
  <rect x="1300" y="405" width="230" height="170" rx="18" fill="#f1eaff" stroke="#8255bd" stroke-width="4"/>
  <text x="1415" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#563687">Data source</text>
  <text x="1415" y="517" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#563687">database or API</text>
  <text x="800" y="680" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#42566f">The browser requests resources; the server processes the request and returns the response.</text>
</svg>
